    semelle: null            # (JD 08/10 soir) plus de haubans de pied : la semelle collée sur le renfort passe l'effort du pied (≈ 2,4 kN) au pont
    semelle_avant_0810:      # ancien étage des semelles (JD 29/09) : directs AV et AR ; croisés passés à l'arrière (libèrent le moteur relevé)
      attache_dx: 100        # pontets sur la semelle, au bout du rail (60 avant le 06/10)
      attache_dx_av: 100     # pontet AV 100 devant le pied de mât, 14 vers l'extérieur (attache_dy_av) : le croisé AV passe à 14 des tubes du coffre
      attache_dy_av: 14
      attache_dx_ar: 140     # pontet AR 140 derrière le pied de mât : le croisé AR passe derrière le pylône de la poutre AV
      dz: 10                 # hauteur de l'œil au-dessus de la semelle
      croises_avant: true    # rétablis : le moteur ne bascule plus (croisement x 820, z 412, loin devant le coffre)
      croises_arriere: true  # rétablis (JD 29/09 soir) : vers un pontet au bord intérieur du pont opposé (jusqu'à la cadène, ils traverseraient le pont bombé)
      pontet_interieur: {x: 2690, dy: 186, dz: 8}

