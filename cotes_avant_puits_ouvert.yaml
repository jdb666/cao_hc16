# HC16 + gréement Rando, mâts posés sur le pont — sans coffre
# Repère : origine = étrave à la flottaison, dans l'axe du bateau
#   X vers l'arrière, Y vers bâbord, Z vers le haut. Unités : mm.
# Source : profil et plan F. Chevalier recalés (±30 mm), plan Rando (JD).

coques:
  longueur: 5050           # P1 (relevé 28/09/2026)
  entraxe: 2000            # V1 = A1 : axe à axe des coques, aux deux poutres
  quille:        [[0,420],[150,120],[500,-54],[1000,-143],[1500,-188],[2400,-188],[3200,-143],[4200,-54],[5050,60]]   # Chevalier, creux recalé sur P6 (500 à la poutre AV)
  pont:          [[0,450.0],[500,398.1],[1000,351.1],[1500,324.2],[2000,312.3],[2500,310.3],[3000,318.4],[3500,326.5],[4000,339.6],[4500,357.6],[5000,378.7],[5050,380.0]]   # P7 : cordeau étrave (450) -> tableau (380) moins les flèches relevées
  demi_largeur:  [[0,4],[300,70],[800,140],[1500,187],[2500,199],[3500,193],[4500,175],[5050,152]]   # Chevalier ×1,168 : D3 = 190 au pied de mât
  bouge_pont: 35           # bombé : la ligne "pont" est le dessus du bombé, dans l'axe (non relevé : V7)

plateforme:
  poutre_av_x: 2070        # P2
  poutre_ar_x: 4145        # P3 = 4 140 et D1 = 2 080 : 4 145
  poutre_av_z: 539.5       # axe aux bouts ; P5 : dessus du longeron 250 au-dessus du pont au pylône AV
  poutre_ar_z: 524         # A3 : dessus de la poutre AR 210 au-dessus du pont
  poutre_z: 532            # moyenne (utilisée par le coffre tant qu'il n'est pas recalé)
  poutre_av_fleche: 100    # V2 : dessus au milieu − dessus au ras des pièces d'angle
  poutre_av_y_libre: 925   # parabole entre les pièces d'angle (ajustement sur photo de face, écart rms < 1 px), droite au-delà
  poutre_axe_u: 16.5       # D5 = 2 170 (face AV poutre AV → face AR poutre AR) : l'axe relevé passe 16,5 derrière le centre du nez, au milieu de la section
  poutre_diam: 62          # nez du profil en goutte (DWG)
  poutre_longueur: 2080    # bouts dans les pièces d'angle (y ±1 040), le longeron passant à l'extérieur
  longeron_y: 1093         # D2 : 2 230 entre faces extérieures des longerons (28/09) → axe du nez à 1 115 − 22
  longeron_dans_pieces: 60 # le longeron entre de 60 dans chaque pièce d'angle
  longeron_diam: 44        # nez du profil en goutte (DWG)
  pylone_diam: 70          # non relevé
  piece_angle:             # pièces d'angle poutre / longeron, d'après les photos du 28/09 (cotes approchées)
    y_int: 925               # face intérieure (A2 = 1 850)
    y_ext: 1122              # nez arrondi : 7 au-delà de la face extérieure du longeron
    y_nez: 1040              # le nez couvre y 1 040 → y_ext
    y_pylone: 1000           # emboîture sur le pylône (axe de coque)
    manchon: 54              # manchon de poutre : ±54 autour de l'axe relevé (poutre 95,5 + parois)
    manchon_demi_h: 40
    nez_x: 97                # le nez dépasse de 97 devant l'axe de la poutre AV (derrière pour l'AR) : ≈ 50 devant la face de la poutre, à confirmer (D6)
    nez_x_fin: 5             # le nez s'arrête 5 devant l'axe : le longeron sort de la pièce
    nez_demi_h: 35
    nez_r: 35
    bossage_d: 84
    bossage_bas: 58          # bas de l'emboîture sous l'axe de poutre
  trampoline_z: 580        # au centre du trampoline (bord avant sur la poutre cintrée, bord arrière à 524)
  trampoline_milieu: {jeu: 20, pas: 150, diam: 4}   # (JD 09/10) deux moitiés lacées au milieu, dans la longueur : l'eau s'en va par l'arrière toute seule
  martingale:              # V4, V5 (28/09/2026) ; pilier + deux tiges inox rigides (pas des câbles)
    pied_sous_axe_extremites: 170   # V4 : bas du pilier sous l'axe de la poutre aux extrémités
    y_cable: 1000                   # V5 : attaches des tiges à 1 000 de l'axe du bateau (axe des coques)
    cable_sous_axe_extremites: 49   # (ancien paramètre) remplacé par le jour ci-dessous
    jour_sous_poutre: 15            # V5 : jour de 15 entre le dessous de la poutre et la tige, au ras de la pièce d'angle (confirmé photo)
    y_jour: 925
    tige_diam: 6                    # Ø des tiges inox : non relevé

mats:
  x_pied: 1960             # (JD 06/10 : réaligner les CV) CV voiles pleines = CV du HC16 d'origine par la même méthode (contours, rond compris : x 3 206) ; 1 766 avant (aligné sur 3 010, un CV de triangles)
  y_axe: 1161              # (JD 06/10 : gréement indépendant du coffre) largeur/2 + diam/2 + 11 : 11 de jeu à la joue pour le mât qui tourne ; bord du mât au bord du pont (1 190), la paroi de coque reprend l'effort vertical (JD 29/09) ; avant : 1 151, à 1 de la joue
  z_pied: 345.4            # dessus de la semelle CP au pied de mât : renfort de pont 8 + bourrage 3 mini (pente P4) + CP 18 (348,1 à x 1 766, avant le recul)
  collier_hauteur: 750     # référence du coffre : les joues montent à 25 au-dessus (z 1 122) ; le collier lui-même est au-dessus des joues (mats.collier)
  collier:                 # (JD 06/10) collier indépendant du coffre : bague où le mât tourne, tourillon emmanché dans le tube (il tourne quand on change de cran), attaches des haubans
    jeu_joue: 10           # dessous du collier à 10 au-dessus du haut des joues (hauteur calculée ; ou `hauteur` le long du mât depuis le dessus de semelle)
    ep: 70                 # (JD 06/10 soir) CP collé stratifié : 7 plis de CP 10 collés à l'époxy, verre-époxy dessus (arêtes arrondies) ; ferrures inox boulonnées à travers, contre-plaques
    materiau: cp
    plis: 7
    alesage: 62            # le mât Ø 60 tourne dans une chemise PEHD de 2 (fendue, emboîtée, vissée : le PEHD ne se colle pas) dans l'alésage du CP (Ø 66) et le long de l'ouverture
    chemise: 2
    r_bague: 55
    nez: 60                # avant du collier, devant l'axe du mât (105 quand le tube était devant)
    demi_y_int: 80         # face intérieure (côté tube) à 80 de l'axe du mât : la branche intérieure va jusqu'au tourillon, derrière le mât
    tourillon_bord: 12     # matière derrière le tourillon
    ouverture_ar: true     # (JD 06/10) ouvert vers l'arrière pour poser le mât (il arrive par l'arrière en se relevant sur l'emplanture), largeur = alésage
    arriere: 55            # bout des branches derrière l'axe du mât
    axe: {d: 10, s: 38}    # axe inox de fermeture derrière le mât, à travers les deux branches, goupillé
    demi_y: 55
    tourillon: {d: 45, l: 80, jeu_tube: 3, prise: 35}   # tube alu Ø 45 collé à l'époxy dans une encoche des plis 2 à 6 (35 de prise), goupillé à travers les plis ; dépasse de 80 dans le tube Ø 50 × 2
    oeil: {saillie: 22, ep: 6, h: 24, dy_av: 40, dy_croise: -30, ar: [20, 70]}   # ferrures inox boulonnées : devant (direct AV à 40 vers l'extérieur ; croisé AV à 30 vers l'intérieur, loin de la livarde rangée) ; AR sur la face extérieure, de 20 à 70 derrière l'axe du mât (JD 06/10 : le hauban AR reste à l'extérieur du mât) ; diagonale en haut de la face intérieure
  emplanture:               # (JD 06/10) cale triangulaire dans un rail U sur la semelle ; le mât tourne sur l'ergot ; la quête se règle au trou du boulon
    rail: {type: joues_cp, l: 140, joue_ep: 10, h: 40, jeu: 0.5, trou: 8, pas: 20, crans: [-1, 0, 1], axe_z: 18}   # (JD 08/10 soir) 3 crans au lieu de 5 : joues de 140 (180 avant)
    # avant le 08/10 soir : l 180, crans [-2, -1, 0, 1, 2]   # (JD 06/10 soir) deux joues CP 10 collées sur la semelle et stratifiées, trous Ø 8 tous les 20 (surpercés, remplis d'époxy, repercés), axe du boulon à 18 au-dessus de la semelle
    cale: {haut: 70, pointe: 6, pointe_z: 7, h: 38, larg: 30, plis: 3}   # (JD 06/10 soir) 3 plis de CP 10 collés, stratifiés ; triangle pointe en bas : elle pivote sur le boulon (quête, pose du mât), le boulon la tient ; dessus 70 de long à 45 au-dessus de la semelle
    ergot: {d: 20, h: 20}   # sur le dessus de la cale ; le pied du mât (embout percé) tourne dessus ; mât raccourci de 45 pour garder la bordure
  longueur: 7300
  diam: 60
  quete_deg: 3
  haubanage: 700           # le long du mât, depuis le pied
  semelle:                 # plat CP collé au pont sur bourrage époxy, perpendiculaire au mât, parallèle au collier CP (JD 28/09)
    y_mat: 1161            # axe du mât : 161 à l'extérieur de l'axe de coque (1 151 avant le 06/10)
    dx: [-304, 90]         # (JD 08/10 soir) une seule semelle par bord pour le mât et les deux tubes du coffre : x 1 656 → 2 050 (plus de pontets au bout)
    # avant : dx: [-100, 150]        # autour du pied de mât (x_pied) : x 1 860 → 2 110, 14 derrière la semelle des tubes du coffre ; à 10 du pylône de la poutre AV
    dy: [-141, 26]         # y 1 020 → 1 187 (tubes du coffre à y 1 066)
    encoche: {dx0: 65, dy1: -116}   # coin arrière intérieur échancré au pylône de la poutre AV : x ≥ 2 025 et y ≤ 1 045 (10 de jeu)
    # avant : dy: [-116, 26]         # côté bâbord (miroir à tribord) : y 1 045 → 1 187 (joue extérieure de l'emplanture CP), 10 de jeu au pylône de la poutre AV ; reçoit le rail de l'emplanture et les pontets (les tubes du coffre ont leurs semelles : coffre.pylones.semelle)
    ep: 18                 # 2 × CP 9 collés
    bourrage_min: 3
    inclinaison_laterale: 0   # mât vertical en travers ; la quête (quete_deg) et l'inclinaison sont fixées par la semelle et le collier
    pente_pont_p4: 2.13    # pente locale du pont retenue au pied de mât (P4 + assiette 0,43°), au lieu de 1,32° pour la tonture du modèle
    renfort:               # renfort de pont cintré sur toute la largeur (JD 29/09) : 2 plis croisés de CP 4 collés en place
      ep: 8
      dx: [-344, 170]      # de 150 devant les tubes du coffre (x 1 616) à 20 derrière la semelle du mât (x 2 130)
      demi_y: 186          # toute la largeur du pont (demi-largeur 190)
      evite: pylone_av     # découpé autour du pylône de la poutre AV (10 de jeu)

voile:                     # repère du mât : u perpendiculaire vers l'arrière, w le long du mât depuis le pied
  contour: [[0,1123],[2839,1603],[2295,3587],[1575,5363],[823,6803],[0,7163]]   # plan Rando 1/25 : amure, écoute, rond de chute, têtière
  livarde:                 # tube carbone droit, d'un seul côté de la voile, du mât (5,10 m sous la têtière) au point d'écoute (JD 29/09)
    w_mat: 2060
    diam: 30
    ep: 1.5
    jeu_mat: 5
    rangee: auto           # auto : rangée dès que la voile est roulée, même en partie
    rangement: {vertical: true}          # rangée debout, verticale, dans le fourreau du coffre (coffre.fourreaux_livarde, JD 30/09) : loin du mât pour ne pas gêner l'enroulement
                                         # (ancienne place : {dx: 85, dy: 0, dw: 800}, parallèle au mât, pied dans un godet sur l'avant du collier)
  enroulement: {babord: 0.5, tribord: 0.5}      # part de surface enroulée : 0 = pleine, 1 = roulée

coffre:                    # joues ellipsoïdales (pointe avant du coffre, collier, bout arrière du banc) ; coffre sous la joue ; CP cousu-collé
  largeur: 2240            # joues à ±1 120 : mâts à ±1 151, tout près du bord du pont ; joues au-dessus du nez des longerons (±1 115)
  face_ar_x: 2022.5        # C4 contre le nez de la poutre AV, sans jour (JD 29/09) ; poches dans les coins arrière pour le nez et le manchon des pièces d'angle
  poches_pieces_angle: {jeu: 4, ouverte_dessous: true}   # ouverte dessous (JD 30/09) : le coffre se pose par-dessus ; avant, le fond fermait la poche et la pièce d'angle bloquait la pose   # coins arrière du coffre évidés autour des pièces d'angle AV (nez jusqu'à x 1 973, manchon dès x 2 016), parois CP comme le bordé
  fond_z: 270              # (JD 09/10, moustache à 10°) fond remonté de 20 : aileron relevé au ras (274), hélice 26 au-dessus ; avant : 250
                           # fond polygonal à 3 segments : plat au milieu ; puits moteur descendu sous l'hélice relevée (JD 29/09 : hélice à 296, aileron à 274)
  fond_plat_demi: 150       # (JD 09/10) plat réduit à ±150 (puits ±134 + parois) : le V à 10° part plus près du milieu et reste haut au-dessus des coques ; avant : 250
                            # plat C1 de 500 ; au-delà, le V remonte aux joues et reste 19 au-dessus des haubans croisés AR (z 342 au droit de C4, y ±704)
  avant_plat_demi: 360      # pointe du fond : x 1 250 sur ±360, raccord droit jusqu'aux joues (forme de l'avant inchangée)
  fond_z_cotes: 439.4      # (JD 09/10) moustache : fond à 10° vers les joues, comme le dessus (270 + 961 × tan 10°) ; avant : 465 (14°)
  fond_pente_cotes_deg: 10 # (pour mémoire : fond_z_cotes en découle)
  dessus_z: 810            # partie centrale plate au niveau du haut de la caisse batterie + ancre (JD 30/09) ; la table se pose dessus
  fourreaux_livarde: null  # (ancien, JD 30/09 matin : trou dans le dessus + fourreau dans le coffre) {dx: 180, y: 1080, diam: 40, ep: 2, l: 300, collier: {h: 20, ouverture: 70}}
  rangement_livarde:       # (JD 30/09 soir) livarde rangée debout À L'EXTÉRIEUR, contre la face extérieure de la joue, 180 devant l'axe du mât au collier :
                           # en bas un godet (bloc CP 2 × 10 : pli percé du trou + pli plein), en haut un collier ouvert vers l'extérieur (bloc CP 2 × 10), collés sur la joue
    dx: 180
    jeu: 2                 # entre la livarde et la joue
    bloc: {larg: 60, saillie: 45, ep: 10}
    godet: {diam: 34, au_dessus_bas: 15}
    collier: {diam: 32, ouverture: 30, sous_haut: 60}   # 60 sous le haut de la joue : 20 sous le hauban direct AV   # livarde rangée (JD 30/09) : trou dans le dessus, 180 devant l'axe du mât au collier,
                                                                                                     # contre la joue ; fourreau de 300 dans le coffre, collier ouvert sur le dessus pour la tenir
  table: null              # (JD 07/10) retirée avec la caisse de la batterie qui la portait (avant : x 1 384 → 1 760, demi_y 360, CP 10, découpée pour la tête du moteur)
  capot_arriere: {x0: 1760, z_c4: 810, demi_y: 450, ep: 6, decoupe_moteur: {x0: 1771, demi_y: 70}, demontable: false}   # (JD 09/10) capot horizontal à 810 (dessus des caissons de rangement à plat, au ras du dessus) : depuis le recul des mâts (06/10), les haubans collier -> poutre passent à 38 au-dessus ; avant : en pente jusqu'à 740 contre C4   # (JD 08/10) élargi à ±450 avec le dessus plat ; fixe (collé) : les batteries sont dans les accoudoirs, une trappe par caisson de rangement   # (JD 05/10) dessus du milieu en pente de x 1 760 (z 810) à C4 (z 740) : les haubans collier -> milieu de la poutre AV passent au-dessus
  dessus_plat_demi: 450      # (JD 08/10) surface plate agrandie de chaque côté du moteur : ±360 -> ±450 (caissons de rangement dessous) ; même cassure que le fond, bordé central C5 cylindrique
  dessus_cotes_au_dessus_collier: 25   # hauteur du collier sur le mât (collier_geom) : inchangée ; le dessus ne monte plus jusqu'au collier
  dessus_pente_cotes_deg: 10   # (JD 09/10) moustache : dessus à 10° du plat (±450) jusqu'aux joues (z 926,6), même angle que le fond ; avant : jusqu'au collier (≈ 25°)
  pattes_collier: null     # (JD 09/10) inutiles : le mât ne tient plus au coffre (avant : pattes alu {larg: 60, ep: 10, ecart: 50, recouvrement: 120, au_dessus_axe_collier: 40})
  dessus_au_dessus_collier: 25   # haut du coffre et des joues = haut du collier
  avant_x: 1584            # pointe avant au droit des joues : 1 390 avant le 06/10 ; reculée de 194 avec les mâts (JD : côtés raccourcis, joue toujours tangente au collier)
  dossier: {h: 400, courbe_continue: true, x_fin_montee: 2160}   # (JD 09/10) dossier relevé à 400 au-dessus de l'assise (z 1 085), indépendant du dessus du coffre (moustache 10°, 927 contre la joue) ;
                           # courbe continue (JD 11 h 45, « pas de décrochage ») : l'arrondi de la joue monte de la pointe jusqu'au dossier, la joue dépasse au-dessus du coffre ;
                           # (courbe_continue: false : montée en S derrière le mât jusqu'à x_fin_montee)
  joues_forme: {n_avant: 2.3, n_arriere: 2.2, plat_jusqu_a_c4: true}   # joues arrondies (JD 30/09) : superellipses (2 = ellipse) ; avant tangent horizontal au collier sans saut de courbure,
                                                                       # dessus plat du collier à C4 (comme le coffre), dossier depuis C4 ; le bordé du coffre suit l'avant à la station des joues
  avant_x_milieu: 1584     # (JD 07/10) avant droit au ras de la pointe des joues : coffre raccourci de 334 au milieu (avant : 1 250, pointe avancée au milieu seulement, JD 29/09 soir)
  fond_pente: {deg: 25, x0: 1860}   # (JD 09/10 : « garder voire augmenter », c'est lui qui protège des vagues) 12° -> 25° (pointe + 55 sur 15°) ; fond bas (z 250) sous l'aileron et l'hélice relevés, de x 1 860 à C4, puis remonte à 12° jusqu'à la pointe (z ≈ 380 au milieu) ; même pente partout -> panneaux plans
  plateau_z: 900           # plateau intérieur
  ep_bordé: 6
  ep_plateau: 6
  ep_fond: 6
  ep_face_ar: 6
  ep_flasque: 9            # joues porte-mât
  ep_cloison: 6
  pas_cloisons: 560
  cloisons_y: []           # ancienne C9.1 (y -500) remplacée par le compartiment batterie (JD 29/09)
  compartiment_batterie: null   # (JD 07/10) plus de caisse de batterie dans le coffre (avant : CP 6 à 3 du bac, montée jusqu'à z 810)
  ancre: {faisceau: [200, 100], verge: [120, 20], anneau: 50, sur: fond}   # grappin pliant ≈ 3–4 kg (hypothèse), couché en travers sur le fond du coffre à ancre, contre la cloison du puits
  coffre_ancre: {demi_y: 250, ep: 6}   # (JD 07/10) petit coffre à ancre devant le puits : deux cloisons CP 6 à ±250, de l'avant à la cloison du puits ; couvercle découpé dans le bordé (trappe)
  yinyang:                 # dessin du bateau (JD 29/09) : taijitu sur la face extérieure des joues et sur les deux faces des voiles
    joues: null            # (JD 09/10) plus de yin-yang sur les joues ; avant : {x: 2250, z: 870, r: 180, ep: 0.5}, sur le dossier derrière le mât
    voiles: {dx: 2558, dz: 1791, r: 180, marge: 30}    # même taille que sur les joues, dans le coin du point d'écoute au-dessus de la livarde (JD 29/09) : centre x 4 324, z 2 139, à 100 de la chute et 60 de la livarde ; suit la toile quand elle est roulée
  couples_coffre:          # couples intérieurs dans le plan des accroches de la poutre AV (JD 29/09) : les efforts des accroches passent dans le fond et le dessus
    - {y: 420, x0: puits, ep: 6}   # (JD 08/10) couple plein déplacé de ±331 à ±420 : côté extérieur des caissons de rangement, de la cloison du puits à C4 (avant : ±331 évidé)
    - {y: 850, ep: 9, evidement: {marge: 60, rayon: 30}}              # sous l'avant des bancs ; ±131 : parois du puits moteur
  couples_travers: []      # retirés (JD 30/09 : seulement les couples dans le sens de la longueur) ; x = face avant, y0 = départ (caisse | puits), jusqu'à la joue
                           # essai du 29/09 : {x: 1497, y0: caisse, ep: 6}, {x: 1705, y0: caisse, ep: 9}, {x: 1811.5, y0: puits, ep: 9}, évidés {marge: 60, rayon: 30}
  batterie: null           # (JD 07/10) plus de batterie dans le coffre (avant : Dyness 24 V 100 Ah, 531 × 206 × 217, 19,3 kg, dans un bac 650 × 315 × 320 en travers devant le puits, x 1 393 → 1 708)
  batterie_banc: null      # (JD 08/10) plus de caisson sur l'avant du banc : deux batteries, une dans chaque accoudoir, au bout des bancs (07/10 : une 24 V 50 Ah dans un caisson sur l'avant du banc bâbord)
  batteries_puits: null    # (JD 08/10 matin, abandonné) deux batteries au fond du coffre, de chaque côté du puits
  accoudoirs:              # (JD 08/10) caisson étanche sur l'arrière de chaque banc, comme un accoudoir, le plus petit possible : toute la profondeur de l'assise, batterie en travers ; l'arrondi de la joue arrive au bout du dessus du caisson
    jeu: 5                 # autour de la batterie, dans le sens de la marche (en travers : 305 de libre pour 260)
    h_libre: 15            # au-dessus de la batterie, pour les bornes et les câbles
    ep: 6                  # CP 6 : face avant, côté intérieur, face arrière ; la joue fait l'extérieur, l'assise le fond
    couvercle: 6           # amovible, sur joint, deux grenouillères
    batterie: {l: 260, larg: 165, h: 210, masse: 11.0}   # LiFePO4 24 V 50 Ah (type Sterling LH2450), en travers : 260 en y, 165 dans le sens de la marche ; une par accoudoir, en parallèle : 100 Ah
    cotes: [babord, tribord]
  trappe:                  # (JD 07/10) couvercle du coffre à ancre, découpé dans le bordé avant au-dessus de z 450 (avant : dessus ouvert au droit de la caisse de batterie, x 1 384 → 1 717, ±334)
    x0: 1560
    x1: 1711               # (JD 09/10 après-midi) jusqu'à la cloison du puits seulement : poche ouverte (avant : 1 800, couvercle jusqu'au capot arrière)
    # x1: 1800             # jusqu'au capot arrière (rogné à son plan) : tout le bordé central devant le capot, entre les stations du loft à ±250 (un seul panneau développable), bords posés sur des tasseaux le long des cloisons
    y0: -250
    y1: 250
    z_seuil: 450
    ouverte: true          # (JD 09/10 après-midi) coffre à ancre ouvert dessus, comme une poche, évacuation en dessous (avant : couvercle découpé dans le bordé)
    evacuation: {d: 25, x: 1698, y: [-120, 120]}   # deux trous Ø 25 dans le fond, au point bas de la poche, contre la cloison du puits
