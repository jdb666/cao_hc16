# HC16 + gréement Nacra 5.80 Rando, mâts posés sur le pont — sans coffre
# Repère : origine = étrave à la flottaison, dans l'axe du bateau
#   X vers l'arrière, Y vers bâbord, Z vers le haut. Unités : mm.
# Source : profil et plan F. Chevalier recalés (±30 mm), plan Rando (JD).

coques:
  longueur: 5050           # P1 (relevé 28/09/2026)
  entraxe: 2000            # V1 = A1 : axe à axe des coques, aux deux poutres
  quille:        [[0,420],[150,120],[500,-54],[1000,-143],[1500,-188],[2400,-188],[3200,-143],[4200,-54],[5050,60]]   # Chevalier, creux recalé sur P6 (500 à la poutre AV)
  pont:          [[0,450.0],[500,398.1],[1000,351.1],[1500,324.2],[2000,312.3],[2500,310.3],[3000,318.4],[3500,326.5],[4000,339.6],[4500,357.6],[5000,378.7],[5050,380.0]]   # P7 : cordeau étrave (450) -> tableau (380) moins les flèches relevées
  demi_largeur:  [[0,4],[300,70],[800,140],[1500,187],[2500,199],[3500,193],[4500,175],[5050,152]]   # Chevalier ×1,168 : D3 = 190 au pied de mât
  bouge_pont: 35           # bombé : la ligne "pont" est le dessus du bombé, dans l'axe (non relevé : V7)

plateforme:
  poutre_av_x: 2070        # P2
  poutre_ar_x: 4145        # P3 = 4 140 et D1 = 2 080 : 4 145
  poutre_av_z: 539.5       # axe aux bouts ; P5 : dessus du longeron 250 au-dessus du pont au pylône AV
  poutre_ar_z: 524         # A3 : dessus de la poutre AR 210 au-dessus du pont
  poutre_z: 532            # moyenne (utilisée par le coffre tant qu'il n'est pas recalé)
  poutre_av_fleche: 100    # V2 : dessus au milieu − dessus au ras des pièces d'angle
  poutre_av_y_libre: 925   # parabole entre les pièces d'angle (ajustement sur photo de face, écart rms < 1 px), droite au-delà
  poutre_axe_u: 16.5       # D5 = 2 170 (face AV poutre AV → face AR poutre AR) : l'axe relevé passe 16,5 derrière le centre du nez, au milieu de la section
  poutre_diam: 62          # nez du profil en goutte (DWG)
  poutre_longueur: 2080    # bouts dans les pièces d'angle (y ±1 040), le longeron passant à l'extérieur
  longeron_y: 1093         # D2 : 2 230 entre faces extérieures des longerons (28/09) → axe du nez à 1 115 − 22
  longeron_dans_pieces: 60 # le longeron entre de 60 dans chaque pièce d'angle
  longeron_diam: 44        # nez du profil en goutte (DWG)
  pylone_diam: 70          # non relevé
  piece_angle:             # pièces d'angle poutre / longeron, d'après les photos du 28/09 (cotes approchées)
    y_int: 925               # face intérieure (A2 = 1 850)
    y_ext: 1122              # nez arrondi : 7 au-delà de la face extérieure du longeron
    y_nez: 1040              # le nez couvre y 1 040 → y_ext
    y_pylone: 1000           # emboîture sur le pylône (axe de coque)
    manchon: 54              # manchon de poutre : ±54 autour de l'axe relevé (poutre 95,5 + parois)
    manchon_demi_h: 40
    nez_x: 97                # le nez dépasse de 97 devant l'axe de la poutre AV (derrière pour l'AR) : ≈ 50 devant la face de la poutre, à confirmer (D6)
    nez_x_fin: 5             # le nez s'arrête 5 devant l'axe : le longeron sort de la pièce
    nez_demi_h: 35
    nez_r: 35
    bossage_d: 84
    bossage_bas: 58          # bas de l'emboîture sous l'axe de poutre
  trampoline_z: 580        # au centre du trampoline (bord avant sur la poutre cintrée, bord arrière à 524)
  martingale:              # V4, V5 (28/09/2026) ; pilier + deux tiges inox rigides (pas des câbles)
    pied_sous_axe_extremites: 170   # V4 : bas du pilier sous l'axe de la poutre aux extrémités
    y_cable: 1000                   # V5 : attaches des tiges à 1 000 de l'axe du bateau (axe des coques)
    cable_sous_axe_extremites: 49   # (ancien paramètre) remplacé par le jour ci-dessous
    jour_sous_poutre: 15            # V5 : jour de 15 entre le dessous de la poutre et la tige, au ras de la pièce d'angle (confirmé photo)
    y_jour: 925
    tige_diam: 6                    # Ø des tiges inox : non relevé

mats:
  x_pied: 1766             # CV voiles pleines = CV HC16 d'origine (3010 mm) avec 3° de quête
  y_axe: 1151              # contre le flasque : largeur/2 + diam/2 + 1
  z_pied: 325              # pont à x_pied, 100 mm hors de l'axe de coque (bombé)
  collier_hauteur: 750     # collier à 0,75 m du pied, le long du mât, porté par la joue
  longueur: 7300
  diam: 60
  quete_deg: 3
  haubanage: 700           # le long du mât, depuis le pied
  semelle:                 # plat CP collé au pont sur bourrage époxy, perpendiculaire au mât, parallèle au collier CP (JD 28/09)
    y_mat: 1101            # axe du mât prévu avec le coffre recalé (101 à l'extérieur de l'axe de coque) ; y_axe passera à 1 101
    dx: [-110, 110]        # autour du pied de mât (x_pied)
    dy: [-141, 49]         # côté bâbord (miroir à tribord) : y 960 → 1 150, reçoit aussi le pylône du coffre
    ep: 18                 # 2 × CP 9 collés
    bourrage_min: 3
    inclinaison_laterale: 0   # mât vertical en travers ; la quête (quete_deg) et l'inclinaison sont fixées par la semelle et le collier
    pente_pont_p4: 2.13    # pente locale du pont retenue au pied de mât (P4 + assiette 0,43°), au lieu de 1,32° pour la tonture du modèle

voile:                     # repère du mât : u perpendiculaire vers l'arrière, w le long du mât depuis le pied
  contour: [[0,1123],[2839,1603],[2295,3587],[1575,5363],[823,6803],[0,7163]]   # plan Rando 1/25 : amure, écoute, rond de chute, têtière
  livarde: {w_mat: 2060, ecart: 200, diam: 30}   # accroche à 5,10 m sous la têtière
  enroulement: {babord: 0.5, tribord: 0.5}      # part de surface enroulée : 0 = pleine, 1 = roulée

coffre:                    # joues ellipsoïdales (pointe avant du coffre, collier, bout arrière du banc) ; coffre sous la joue ; CP cousu-collé
  largeur: 2240            # hors tout = poutre_longueur (à mesurer)
  face_ar_x: 1972          # contre la face avant de la poutre AV (2010 - 76/2)
  fond_z: 378              # fond polygonal à 3 segments : plat au milieu (sous la chaise moteur)
  fond_plat_demi: 360       # plat C1 de 720 : le bac de batterie (650) y repose à plat
  fond_z_cotes: 465        # au droit des joues (base des joues)
  dessus_z: 760              # dessus au milieu, plat sur ±dessus_plat_demi
  dessus_plat_demi: 360      # même cassure que le fond : bordé central C5 cylindrique, trappe de batterie plane dans C5
  dessus_cotes_au_dessus_collier: 25   # dessus au droit des joues = haut du collier
  pattes_collier:          # pattes alu sur la face extérieure des joues, devant et derrière le mât
    larg: 60
    ep: 10
    ecart: 50              # du bord de la patte à l axe du collier (dégage le mât incliné)
    recouvrement: 120      # longueur boulonnée sur la joue
    au_dessus_axe_collier: 40
  dessus_au_dessus_collier: 25   # haut du coffre et des joues = haut du collier
  avant_x: 1400            # pointe avant du coffre (réduite)
  plateau_z: 900           # plateau intérieur
  ep_bordé: 6
  ep_plateau: 6
  ep_fond: 6
  ep_face_ar: 6
  ep_flasque: 9            # joues porte-mât
  ep_cloison: 6
  pas_cloisons: 560
  cloisons_y: [-500]       # compartiment tribord (608 mm) pour la batterie ; le puits du moteur est côté bâbord
  batterie:                # Dyness 24 V 100 Ah (531 × 206 × 217, 19,3 kg) dans son bac 590 × 260 × 330, au milieu sur C1
    bac: [650, 315, 320]   # y (en travers, parallèle à la poutre), x (profondeur), z (hauteur) : bornes en haut
    cellule: [531, 206, 217]
    masse: 19.3
    x_ar: 1955             # 11 mm devant la face arrière : le bac descend à la verticale par la trappe du dessus
    y_ext: -325            # centré
    appui_direct: true     # posé à plat sur C1
  trappe:                  # trappe de la batterie dans le dessus, au-dessus de C1 (découpée dans le dessus assemblé)
    x0: 1633
    x1: 1962
    y0: -332               # bords de 28 mm jusqu'aux cassures de C5
    y1: 332
    z_seuil: 600           # ne coupe que le dessus
  trappes_c4:              # trappes de visite dans la face arrière, au-dessus de la poutre (seuls autres accès)
    - {y0: -1050, y1: -650, z0: 700, z1: 880}
    - {y0: 770, y1: 1060, z0: 700, z1: 880}   # à l'extérieur du puits
  moteur:                  # Haswing Protruar 2.0 24 V
    mode: arriere          # décalé bâbord, chaise fixe sous le coffre, bascule vers l'arrière sous le trampoline (axe de la bride)
    transversal:
      bascule: 0           # 0 = en marche ; 90 = relevé, couché vers bâbord dans le coffre
      x_arbre: 1775
      charniere_z: 500     # axe de la charnière (longitudinal)
      charniere_decalage: 80   # axe 80 côté tribord (côté tête) : relevé, le moteur se couche 80 au-dessus de la charnière
      palier_av_x: 1510
      palier_ar_x: 1625
      bride_sous_charniere: 40 # bord haut de la planche 40 sous l'axe
      arbre_au_dessus: 120 # en marche : axe d'hélice à -330
      planche_ep: 40
      planche_h: 70
      planche_demi_larg: 100
      flasque_ep: 20
      encoche_arbre: 80    # le volet laisse passer l'arbre en marche
      volet: true
      fente:               # ouverture du fond pour la bascule, fermée par le volet une fois le moteur relevé
        x0: 1610
        x1: 1966
        y0: -40
        y1: 905
    ancien_mode: transversal      # "arriere" : bascule vers l'arrière sous la martingale ; "avant" et "vertical" : variantes
    arriere:               # bascule vers l'arrière sous la martingale
      type_chaise: fixe    # "fixe" : planche fixe, le moteur bascule sur l'axe de sa bride ; "pivotante" : variante à charnière
      bascule: 0           # 0 = en marche ; 90 = relevé à l'horizontale sous la martingale et le trampoline
      y: 620               # décalé sur bâbord : tête sous la pente haute du dessus (plat élargi à ±360)
      encoche_c4:          # passage de l'arbre basculé sous le bas de la face arrière
        demi_y: 45
        z: 470
      x_arbre: 1860
      bride_axe_z: 420     # axe de bascule de la bride : relevé, le moteur se couche à cette hauteur (sous le câble ≈ 468)
      bride_axe_devant_arbre: 10     # géométrie de bride estimée (à relever sur la Protruar)
      bride_axe_derriere_planche: 60
      bride_axe_sur_planche: 40      # l'axe est 40 au-dessus du bord de la planche
      arbre_au_dessus: 120 # arbre 120 au-dessus de l'axe : hélice à -410 en marche ; relevé, la tête reste devant la planche
      rotation_tete_avant_bascule: 90  # barre tournée de 90° avant de basculer : nacelle en travers
      planche_ep: 40
      planche_h: 70         # 7 cm suffisent au serrage de la bride
      demi_larg: 100
      demi_passage: 110    # joues de part et d'autre du passage de la tête
      ep_joue: 25
      long_joue: 160
      carter:              # boîte sous le coffre prolongeant les joues de chaise : la tête relevée y est protégée
        x_av: 1430
        ep: 9
      niche:               # boîte dans le coffre, ouverte en dessous : loge la tête en marche et son balayage
        x0: 1439
        x1: 1966
        demi_y: 125          # 250 : la tête (200 × 140, diagonale 244) tourne de 90° dans le puits avant la bascule
        z_haut: 2000         # parois jusqu'au bordé
        ep: 6
      # variante chaise pivotante (type_chaise: pivotante)
      charniere_z: 490
      charniere_derriere_arbre: 70
      bride_z: 500
      arbre_au_dessus_bascule: 50
      planche_ep_piv: 40
      ep_ferrure: 10
      long_ferrure: 80
    avant:                 # moteur reculé et rehaussé au maximum, dans une boîte au milieu du coffre ; bascule vers l'avant par une fente
      bascule: 0           # 0 = en marche ; 90 = relevé à l'horizontale vers l'avant
      rotation_tete: 160   # tête tournée de 160° : l'hélice tire vers l'avant (poussée à 20° de l'axe)
      x_arbre: 1575        # reculé au maximum : en bascule, l'angle de la tête passe 16 mm devant la face arrière
      pivot_z: 610         # rehaussé : axe d'hélice à -240 en marche (immersion mini raisonnable pour Ø 236)
      tableau_ep: 40       # tableau de serrage derrière l'arbre, sous le fond du coffre
      demi_larg: 90
      tableau_haut: 470    # 140 sous l'axe : la tête basculée passe au-dessus
      tableau_bas: 350
      ep_joue: 25
      long_joue: 120
      boite:               # boîte étroite dans le coffre : loge la tête en marche et au relevage ; trappe au-dessus
        demi_y: 100
        ep: 6
        x_ar: 1960
        z_fente: 660       # passage de l'arbre dans la face avant au relevage
        face_fermee: false # la tête dépasse du coffre en marche : boîte ouverte devant et dessus (capot amovible)
    levee: 0               # 0 = en marche ; 650 = relevé (course de réglage de l'arbre ≈ 620–700 mm selon Haswing)
    arbre_l: 900           # arbre 900 mm (35,5")
    arbre_d: 30
    bride_nacelle_max: 850 # distance bride -> axe de nacelle, arbre descendu au maximum (estimée)
    recul_arbre: 70        # axe de l'arbre derrière la face arrière de la chaise
    tete: [200, 140, 260]  # tête (estimée), barre franche repliée à la verticale
    nacelle_d: 100
    nacelle_l: 300
    helice_d: 236          # hélice tripale 9,3"
    chaise:                # tableau de serrage sous le fond du coffre, au milieu ; la bride serre son bord haut
      x_face_ar: 1710
      ep: 40
      demi_larg: 120
      z_bride: 500         # bord haut = fond du coffre : hélice à -350 en marche
      z_bas: 380
    puits:                 # boîte verticale à travers le coffre (tête et arbre au relevage), trappe au-dessus
      x0: 1670
      x1: 1920
      demi_y: 120
      ep: 6
  joues:
    montee_fin_devant_mat: 0
  pylones:                 # au bout du coffre, sous chaque joue, au droit du mât
    dx: 120
    dy: 90
    ep: 9
  bancs:
    plan_z: 570
    longueur: 1200         # fin des bancs à x 3 172
    x_debut: 2084            # derrière la queue de la poutre avant (x 2 075)
    y_int: 800
    hauteur: 100
    rayon_aretes: 20
    ep_assise: 9
    ep_cotes: 6
    ep_fond: 4
    poutre_x: 2010
    poutre_z: 590
    longeron_y: 1050
    encoche_poutre_r: 42
    encoche_longeron_r: 28

safrans:
  x: 5120
  corde: 220
  hauteur: 800
  z_centre: -120
  epaisseur: 20
  barre_x: 5350
  barre_z: 300

tente:                     # tente igloo (camping au mouillage) : couvre coffre, bancs et trampoline ; voiles roulées
  x0: 1550                 # bord avant : lacé sur le dessus du coffre (latte transversale), nez du coffre dehors
  x1: 4120                 # bord arrière : poutre arrière
  demi_y: 1120             # bords latéraux : dessus des joues puis des bancs, puis le long des longerons
  z_arriere: 622           # dessus de la poutre arrière
  sommet_z: 1900           # 1 330 au-dessus du trampoline
  exposant: 0.5            # forme : 1 = coussin, 0.5 = dôme à parois raides
  arceau_diam: 11          # 2 arceaux alu Ø 11 en diagonale, croisés au sommet
